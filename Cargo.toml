[package]
name = "CFnat"
version = "1.0.0"
edition = "2024"

[lib]
name = "cfnat"
path = "src/lib.rs"

[[bin]]
name = "CFnat"
path = "src/bin/cfnat.rs"

[features]
default = []
web = ["axum", "tower-http", "rust-embed", "tokio-stream"]
flutter-web = ["web"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
hyper = { version = "1", features = ["client"], default-features = false }
hyper-util = { version = "0.1", features = ["client-legacy"], default-features = false }
hyper-rustls = { version = "0.27", features = ["ring", "http1"], default-features = false }
rustls = { version = "0.23", default-features = false }
http = { version = "1", default-features = false }
tower-service = { version = "0.3", default-features = false }
parking_lot = "0.12"
axum = { version = "0.8", optional = true }
tower-http = { version = "0.7", features = ["cors"], optional = true }
serde = { version = "1.0", features = ["derive"] }
rust-embed = { version = "8.0", features = ["compression", "include-exclude"], optional = true }
tokio-stream = { version = "0.1", optional = true }
mimalloc = { version = "0.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"